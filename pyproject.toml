[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research-agent"
version = "0.1.0"
description = "A constrained natural-language strategy interpreter"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "openai>=2,<3", "python-dotenv>=1,<2", "streamlit>=1.59,<2", "yfinance>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
